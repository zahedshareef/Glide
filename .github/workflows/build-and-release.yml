name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build Glide.slnx -c Release --no-restore

    - name: Test
      run: dotnet test Glide.slnx -c Release --no-build

    - name: Publish (Framework-Dependent / Portable)
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet publish src/app/Glide.csproj -c Release -o publish/portable

    - name: Publish (Self-Contained win-x64)
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet publish src/app/Glide.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o publish/win-x64

    - name: Zip Artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        Compress-Archive -Path publish/portable/* -DestinationPath Glide-Portable.zip
        Compress-Archive -Path publish/win-x64/* -DestinationPath Glide-win-x64.zip
      shell: powershell

    - name: Upload Build Artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: Glide-Builds
        path: |
          Glide-Portable.zip
          Glide-win-x64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Glide-Portable.zip
          Glide-win-x64.zip
        generate_release_notes: true
