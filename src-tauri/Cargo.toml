[package]
name = "glide"
version = "0.1.0"
description = "Glide settings shell"
authors = ["Glide contributors"]
edition = "2021"

[package.metadata.tauri]

[package.metadata.tauri.bundle]
active = false
icon = []

[lib]
name = "glide_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The GNU Windows linker cannot emit a debug DLL with the symbol count pulled
# in by WebView2/Tauri. Keep debug builds debuggable through Rust line tables
# while omitting the oversized linker debug payload.
[profile.dev]
debug = "line-tables-only"
